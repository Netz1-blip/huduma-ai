<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#004d40">
    <title>Huduma AI - Verified Government Services Assistant</title>
    <style>
        /* ============================================
           CSS VARIABLES & RESET
           ============================================ */
        :root {
            /* Colors */
            --primary-green: #004d40;
            --primary-dark: #00352c;
            --kenya-black: #000000;
            --kenya-red: #BB1E10;
            --kenya-green: #006600;
            --bg-white: #ffffff;
            --bg-grey: #f9fafb;
            --chat-bot: #f3f4f6;
            --chat-user: #dff6ec;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --border-light: #e5e7eb;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --glow-green: 0 0 20px rgba(0, 77, 64, 0.15);
            
            /* Spacing */
            --space-xs: 0.25rem;
            --space-sm: 0.5rem;
            --space-md: 1rem;
            --space-lg: 1.5rem;
            --space-xl: 2rem;
            
            /* Typography */
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            --text-sm: 0.875rem;
            --text-base: 1rem;
            --text-lg: 1.125rem;
            --text-xl: 1.25rem;
            --text-2xl: 1.5rem;
            
            /* Transitions */
            --transition-fast: 150ms ease;
            --transition-base: 250ms ease;
            --transition-slow: 350ms ease;
            
            /* Layout */
            --header-height: 80px;
            --input-height: 80px;
            --max-width: 800px;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --radius-full: 9999px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: var(--font-sans);
            font-size: var(--text-base);
            line-height: 1.6;
            color: var(--text-primary);
            background: var(--bg-grey);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Focus visible styles */
        :focus-visible {
            outline: 3px solid var(--primary-green);
            outline-offset: 2px;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-light);
            border-radius: var(--radius-full);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        /* ============================================
           APP CONTAINER
           ============================================ */
        .app {
            max-width: var(--max-width);
            margin: 0 auto;
            background: var(--bg-white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: var(--shadow-lg);
        }

        @media (min-width: 801px) {
            .app {
                min-height: calc(100vh - 2rem);
                margin: 1rem auto;
                border-radius: var(--radius-lg);
                overflow: hidden;
            }
        }

        /* ============================================
           HEADER
           ============================================ */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
        }

        .kenya-flag-accent {
            display: flex;
            height: 4px;
            width: 100%;
        }

        .kenya-flag-accent .black {
            flex: 1;
            background: var(--kenya-black);
        }

        .kenya-flag-accent .red {
            flex: 1;
            background: var(--kenya-red);
        }

        .kenya-flag-accent .green {
            flex: 1;
            background: var(--kenya-green);
        }

        .header-content {
            display: flex;
            align-items: center;
            gap: var(--space-md);
            padding: var(--space-md) var(--space-lg);
            height: calc(var(--header-height) - 4px);
        }

        .ai-avatar {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-full);
            background: linear-gradient(135deg, var(--primary-green) 0%, var(--primary-dark) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: var(--shadow-md);
            position: relative;
        }

        .ai-avatar svg {
            width: 28px;
            height: 28px;
            fill: white;
        }

        .online-indicator {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            background: #22c55e;
            border-radius: var(--radius-full);
            border: 2px solid white;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .header-text {
            flex: 1;
            min-width: 0;
        }

        .header-title {
            font-size: var(--text-lg);
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.3;
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }

        .verified-badge {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            background: var(--chat-user);
            color: var(--primary-green);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: var(--radius-sm);
            white-space: nowrap;
        }

        .verified-badge svg {
            width: 12px;
            height: 12px;
        }

        .header-subtitle {
            font-size: var(--text-sm);
            color: var(--text-secondary);
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: var(--radius-full);
        }

        /* ============================================
           CHAT CONTAINER
           ============================================ */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: var(--space-md);
            scroll-behavior: smooth;
        }

        @media (min-width: 640px) {
            .chat-container {
                padding: var(--space-lg);
            }
        }

        /* ============================================
           WELCOME SECTION
           ============================================ */
        .welcome-section {
            margin-bottom: var(--space-xl);
            animation: slideInUp 0.5s ease;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .welcome-card {
            background: linear-gradient(135deg, var(--primary-green) 0%, var(--primary-dark) 100%);
            color: white;
            padding: var(--space-lg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
        }

        .welcome-title {
            font-size: var(--text-xl);
            font-weight: 700;
            margin-bottom: var(--space-sm);
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }

        .wave-emoji {
            display: inline-block;
            animation: wave 1.5s ease infinite;
            transform-origin: 70% 70%;
        }

        @keyframes wave {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(20deg); }
            75% { transform: rotate(-10deg); }
        }

        .welcome-text {
            font-size: var(--text-base);
            opacity: 0.95;
            line-height: 1.5;
        }

        .quick-chips {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-sm);
            margin-top: var(--space-md);
        }

        .quick-chip {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: var(--space-sm) var(--space-md);
            border-radius: var(--radius-full);
            font-size: var(--text-sm);
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-fast);
            white-space: nowrap;
        }

        .quick-chip:hover,
        .quick-chip:focus {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-1px);
        }

        .quick-chip:active {
            transform: translateY(0);
        }

        /* ============================================
           MESSAGES
           ============================================ */
        .messages {
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
        }

        .message {
            display: flex;
            gap: var(--space-sm);
            animation: messageEnter 0.3s ease;
            max-width: 100%;
        }

        @keyframes messageEnter {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-full);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: var(--text-sm);
        }

        .message.bot .message-avatar {
            background: linear-gradient(135deg, var(--primary-green) 0%, var(--primary-dark) 100%);
            color: white;
        }

        .message.user .message-avatar {
            background: var(--chat-user);
            color: var(--primary-green);
        }

        .message-content {
            flex: 1;
            min-width: 0;
            max-width: calc(100% - 50px);
        }

        .message-bubble {
            padding: var(--space-md);
            border-radius: var(--radius-md);
            font-size: var(--text-base);
            line-height: 1.6;
            word-wrap: break-word;
            box-shadow: var(--shadow-sm);
        }

        .message.bot .message-bubble {
            background: var(--chat-bot);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
        }

        .message.user .message-bubble {
            background: var(--chat-user);
            color: var(--text-primary);
            border-bottom-right-radius: 4px;
        }

        .message-meta {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            margin-top: var(--space-xs);
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .message.user .message-meta {
            justify-content: flex-end;
        }

        .ai-label {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            color: var(--primary-green);
            font-weight: 600;
        }

        .ai-label svg {
            width: 12px;
            height: 12px;
        }

        /* ============================================
           TYPING INDICATOR
           ============================================ */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            padding: var(--space-md) 0;
        }

        .typing-bubble {
            background: var(--chat-bot);
            padding: var(--space-md) var(--space-lg);
            border-radius: var(--radius-md);
            border-bottom-left-radius: 4px;
            box-shadow: var(--shadow-sm);
        }

        .typing-dots {
            display: flex;
            gap: 4px;
            align-items: center;
            height: 20px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--text-secondary);
            border-radius: var(--radius-full);
            animation: typingBounce 1.4s ease infinite;
        }

        .typing-dot:nth-child(1) { animation-delay: 0ms; }
        .typing-dot:nth-child(2) { animation-delay: 200ms; }
        .typing-dot:nth-child(3) { animation-delay: 400ms; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        /* ============================================
           INPUT AREA
           ============================================ */
        .input-container {
            position: sticky;
            bottom: 0;
            background: var(--bg-white);
            border-top: 1px solid var(--border-light);
            padding: var(--space-md);
            padding-bottom: max(var(--space-md), env(safe-area-inset-bottom));
            box-shadow: 0 -4px 6px -1px rgba(0, 0, 0, 0.05);
            z-index: 50;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            background: var(--bg-grey);
            border: 2px solid transparent;
            border-radius: var(--radius-xl);
            padding: var(--space-sm) var(--space-md);
            transition: all var(--transition-fast);
        }

        .input-wrapper:focus-within {
            background: var(--bg-white);
            border-color: var(--primary-green);
            box-shadow: var(--glow-green);
        }

        .message-input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: var(--text-base);
            color: var(--text-primary);
            padding: var(--space-sm) 0;
            min-height: 24px;
            max-height: 120px;
            resize: none;
            font-family: inherit;
        }

        .message-input::placeholder {
            color: var(--text-secondary);
        }

        .message-input:focus {
            outline: none;
        }

        .send-button {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-full);
            background: var(--primary-green);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-fast);
            flex-shrink: 0;
        }

        .send-button:hover:not(:disabled) {
            background: var(--primary-dark);
            transform: scale(1.05);
        }

        .send-button:active:not(:disabled) {
            transform: scale(0.95);
        }

        .send-button:disabled {
            background: var(--border-light);
            cursor: not-allowed;
        }

        .send-button svg {
            width: 20px;
            height: 20px;
            fill: white;
            margin-left: 2px;
        }

        .send-button:disabled svg {
            fill: var(--text-secondary);
        }

        .input-hint {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: var(--space-sm);
        }

        /* ============================================
           UTILITY CLASSES
           ============================================ */
        .hidden {
            display: none !important;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }
    </style>
</head>
<body>
    <div class="app" role="main" aria-label="Huduma AI Chat Interface">
        <!-- Header -->
        <header class="header" role="banner">
            <div class="kenya-flag-accent" aria-hidden="true">
                <div class="black"></div>
                <div class="red"></div>
                <div class="green"></div>
            </div>
            <div class="header-content">
                <div class="ai-avatar" aria-hidden="true">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
                        <circle cx="12" cy="12" r="3" fill="rgba(255,255,255,0.3)"/>
                    </svg>
                    <span class="online-indicator" aria-hidden="true"></span>
                </div>
                <div class="header-text">
                    <h1 class="header-title">
                        Huduma AI
                        <span class="verified-badge">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                            </svg>
                            Verified
                        </span>
                    </h1>
                    <p class="header-subtitle">
                        <span class="status-dot" aria-hidden="true"></span>
                        <span>Verified Government Services Assistant</span>
                    </p>
                </div>
            </div>
        </header>

        <!-- Chat Container -->
        <div class="chat-container" id="chatContainer" role="region" aria-label="Chat messages" tabindex="0">
            <!-- Welcome Section -->
            <section class="welcome-section" aria-labelledby="welcome-heading">
                <div class="welcome-card">
                    <h2 id="welcome-heading" class="welcome-title">
                        Karibu <span class="wave-emoji" aria-hidden="true">👋</span>
                    </h2>
                    <p class="welcome-text">
                        Ask about Kenyan government services in English or Swahili. I'm here to help you find verified information quickly and easily.
                    </p>
                    <div class="quick-chips" role="list" aria-label="Quick suggestions">
                        <button class="quick-chip" role="listitem" data-query="How do I replace a lost birth certificate?" tabindex="0">
                            Replace Birth Certificate
                        </button>
                        <button class="quick-chip" role="listitem" data-query="How do I apply for a passport?" tabindex="0">
                            Apply for Passport
                        </button>
                        <button class="quick-chip" role="listitem" data-query="How do I get a KRA PIN?" tabindex="0">
                            Get KRA PIN
                        </button>
                        <button class="quick-chip" role="listitem" data-query="How do I register for SHA?" tabindex="0">
                            SHA Registration
                        </button>
                        <button class="quick-chip" role="listitem" data-query="How do I apply for HELB loan?" tabindex="0">
                            HELB Loan Help
                        </button>
                    </div>
                </div>
            </section>

            <!-- Messages -->
            <div class="messages" id="messages" role="log" aria-live="polite" aria-atomic="false">
                <!-- Messages will be inserted here -->
            </div>

            <!-- Typing Indicator -->
            <div class="typing-indicator hidden" id="typingIndicator" aria-live="polite">
                <div class="message-avatar" aria-hidden="true">AI</div>
                <div class="typing-bubble">
                    <div class="typing-dots" aria-label="Huduma AI is typing">
                        <span class="typing-dot"></span>
                        <span class="typing-dot"></span>
                        <span class="typing-dot"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-container" role="form" aria-label="Message input">
            <div class="input-wrapper">
                <textarea 
                    id="messageInput" 
                    class="message-input" 
                    placeholder="Ask in English or Swahili..."
                    aria-label="Type your message"
                    rows="1"
                    autocomplete="off"
                ></textarea>
                <button 
                    id="sendButton" 
                    class="send-button" 
                    aria-label="Send message"
                    disabled
                >
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </div>
            <p class="input-hint">Press Enter to send • Shift+Enter for new line</p>
        </div>
    </div>

    <script>
        // ============================================
        // MOCK RESPONSE DATABASE
        // ============================================
        const mockResponses = {
            birth_certificate: {
                english: `To replace a lost birth certificate in Kenya, follow these steps:

**1. Visit the Civil Registration Department**
• Go to the Department of Civil Registration headquarters in Nairobi, or any Huduma Centre nationwide.

**2. Required Documents:**
• Police abstract report (for lost certificate)
• Copy of parent's national ID
• Your national ID (if adult)
• Affidavit sworn by a parent or guardian
• Application fee: KSh 100-200

**3. Processing Time:**
• Approximately 7-14 working days
• You can collect from the same office or request delivery

**4. Online Option:**
• Visit eCitizen.go.ke and search for "Birth Certificate" services
• Fill the application form online
• Pay via M-Pesa

**2. Nyaraka Zinazohitajika:**

• Nakili ya kitambulisho cha mzazi

• Tafuta huduma za "Birth Certificate"
• Jaza fomu na lipa kupitia M-Pesa

Je, unahitaji msaada kwa huduma nyingine za serikali?`
            },
            passport: {
                english: `Here's how to apply for a Kenyan passport:

• Visit eCitizen.go.ke
• Register with your email and phone number

**Hatua za Maombi:**

**4. Rekodi za Bayometriki**
• Weka miadi katika ofisi ya Uhamiaji

**5. Kukusanya:**

Kumbuka: Waombaji wa mara ya kwanza lazima waende kwa umbali.`
            },
            kra_pin: {
                english: `How to get your KRA PIN Certificate:

**Online Registration (Recommended):**

**1. Visit iTax Portal**
• Go to itax.kra.go.ke
• Click "New PIN Registration"

        // ============================================
        // DOM ELEMENTS
        // ============================================
        const chatContainer = document.getElementById('chatContainer');
        const messagesContainer = document.getElementById('messages');
        const typingIndicator = document.getElementById('typingIndicator');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const quickChips = document.querySelectorAll('.quick-chip');

        // ============================================
        // UTILITY FUNCTIONS
        // ============================================
        
        // Get current timestamp
        function getTimestamp() {
            const now = new Date();
            return now.toLocaleTimeString('en-US', { 
                hour: 'numeric', 
                minute: '2-digit',
                hour12: true 
            });
        }

        // Detect language from text
        function detectLanguage(text) {
            const swahiliWords = ['je', 'jinsi', 'namna', 'nipatie', 'tafadhali', 'nataka', 'naomba', 'habari', 'karibu', 'kwa', 'ya', 'wa', 'za', 'nchi', 'serikali', 'mimi', 'msaada', 'sijui', 'unaweza'];
            const lowerText = text.toLowerCase();
            const hasSwahili = swahiliWords.some(word => lowerText.includes(word));
            return hasSwahili ? 'swahili' : 'english';
        }

        // Match query to service
        function matchService(query) {
            const lowerQuery = query.toLowerCase();
            
            const patterns = {
                birth_certificate: ['birth certificate', 'certificates of birth', 'cheti cha kuzaliwa', 'kuzaliwa', 'birth cert'],
                passport: ['passport', 'pasi', 'travel document'],
                kra_pin: ['kra', 'pin', 'tax', 'kodi', 'itax', 'kra pin'],
                sha: ['sha', 'nhif', 'health insurance', 'bima ya afya', 'social health', 'afya yangu'],
                helb: ['helb', 'loan', 'mkopo', 'higher education', 'student loan', 'chuo', 'university']
            };

            for (const [service, keywords] of Object.entries(patterns)) {
                if (keywords.some(keyword => lowerQuery.includes(keyword))) {
                    return service;
                }
            }
            return 'default';
        }

        // Format message with markdown-like styling
        function formatMessage(text) {
            return text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n\n/g, '</p><p>')
                .replace(/\n/g, '<br>');
        }

        // ============================================
        // MESSAGE FUNCTIONS
        // ============================================

        // Create message element
        function createMessageElement(text, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;
            
            const avatar = isUser ? 'You' : 'AI';
            const timestamp = getTimestamp();
            
            const aiBadge = !isUser ? `
                <span class="ai-label">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                    </svg>
                    Verified
                </span>
            ` : '';
            
            messageDiv.innerHTML = `
                <div class="message-avatar" aria-hidden="true">${avatar}</div>
                <div class="message-content">
                    <div class="message-bubble">
                        <p>${formatMessage(text)}</p>
                    </div>
                    <div class="message-meta">
                        ${aiBadge}
                        <span>${timestamp}</span>
                    </div>
                </div>
            `;
            
            return messageDiv;
        }

        // Add message to chat
        function addMessage(text, isUser = false) {
            const message = createMessageElement(text, isUser);
            messagesContainer.appendChild(message);
            scrollToBottom();
        }

        // Show typing indicator
        function showTyping() {
            typingIndicator.classList.remove('hidden');
            scrollToBottom();
        }

        // Hide typing indicator
        function hideTyping() {
            typingIndicator.classList.add('hidden');
        }

        // Scroll to bottom
        function scrollToBottom() {
            setTimeout(() => {
                chatContainer.scrollTo({
                    top: chatContainer.scrollHeight,
                    behavior: 'smooth'
                });
            }, 50);
        }

        // Call the real RAG backend
        async function sendToHudumaAI(userMessage) {
            // Use deployed URL - change to '/api/chat' for production or when both frontend and backend are on same domain
            const apiUrl = window.location.hostname === 'localhost' || window.location.protocol === 'file:'
                ? 'https://huduma-8d2ejudx5-netz1-blips-projects.vercel.app/api/chat'
                : '/api/chat';
            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: userMessage })
            });
            if (!response.ok) {
                throw new Error('Server error');
            }
            const data = await response.json();
            return data.reply;
        }

        // Handle sending message
        async function sendMessage(text) {
            if (!text.trim()) return;

            messageInput.disabled = true;
            sendButton.disabled = true;

            addMessage(text, true);

            messageInput.value = '';
            messageInput.style.height = 'auto';

            showTyping();

            try {
                const reply = await sendToHudumaAI(text);
                hideTyping();
                addMessage(reply, false);
            } catch (error) {
                hideTyping();
                addMessage("Samahani, kuna tatizo la kiufundi kwa sasa. Tafadhali jaribu tena baada ya muda mfupi.", false);
            }

            messageInput.disabled = false;
            messageInput.focus();
            updateSendButton();
        }

        // Update send button state
        function updateSendButton() {
            const hasText = messageInput.value.trim().length > 0;
            sendButton.disabled = !hasText;
        }

        // ============================================
        // EVENT LISTENERS
        // ============================================

        // Send button click
        sendButton.addEventListener('click', () => {
            sendMessage(messageInput.value);
        });

        // Enter key to send
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage(messageInput.value);
            }
        });

        // Input change
        messageInput.addEventListener('input', () => {
            updateSendButton();
            // Auto-resize textarea
            messageInput.style.height = 'auto';
            messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
        });

        // Quick chip clicks
        quickChips.forEach(chip => {
            chip.addEventListener('click', () => {
                const query = chip.getAttribute('data-query');
                sendMessage(query);
            });
            
            chip.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    const query = chip.getAttribute('data-query');
                    sendMessage(query);
                }
            });
        });

        // Initialize with welcome message after short delay
        setTimeout(() => {
            addMessage(`Jambo! Welcome to Huduma AI. I'm here to help you access verified information about Kenyan government services.

Feel free to ask me about:
• National ID • SHA • KRA PIN • Passport • NSSF
• Birth Certificate • Driving Licence • Business Registration
• HELB • Police Clearance

How can I assist you today?`, false);
        }, 1000);

        // Focus input on load
        window.addEventListener('load', () => {
            messageInput.focus();
        });

        // Handle visibility change (pause/resume animations)
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                document.body.classList.add('paused');
            } else {
                document.body.classList.remove('paused');
            }
        });
    </script>
